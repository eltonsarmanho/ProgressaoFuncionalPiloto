[project]
name = "progressao-funcional-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not maritalk_live'"
markers = [
    "integration: requires PostgreSQL (AD-004)",
    "maritalk_live: calls the real MariTalk API; opt-in with RUN_LIVE_MARITALK=1 (ACC-04)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
